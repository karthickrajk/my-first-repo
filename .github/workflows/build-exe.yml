name: Build Windows exe

on:
  push:
    paths: ['app.py', 'index.html', 'main.js', 'lang-ta.js', 'vendor/**', 'requirements.txt', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name DriveReady --add-data "index.html;." --add-data "main.js;." --add-data "lang-ta.js;." --add-data "vendor;vendor" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriveReady-windows
          path: dist/DriveReady.exe
